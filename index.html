<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Olas de Chile Ecocamp — camping ecológico en Alto Punta de Lobos, Pichilemu. 16 sitios, energía 100% solar, pet friendly." />
    <meta name="theme-color" content="#2d4a3e" />
    <title>Olas de Chile Ecocamp — Pichilemu</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/logo-web.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="home">
    <a class="skip-link" href="#main" data-i18n="skip">Ir al contenido</a>
    <div id="siteHeader"></div>

    <main id="main">
      <!-- HERO -->
      <section class="hero" id="hero">
        <div class="hero-bg">
          <img src="https://images.pexels.com/photos/30548681/pexels-photo-30548681.jpeg?auto=compress&cs=tinysrgb&w=1800" alt="" />
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
          <h1 class="hero-title">
            <span data-i18n="hero_title_1"></span>
            <em data-i18n="hero_title_2"></em>
          </h1>
          <p class="hero-subtitle" data-i18n="hero_subtitle"></p>
          <div class="hero-actions">
            <a href="sitios.html" class="btn btn-light" data-i18n="hero_cta_primary"></a>
            <a href="indicaciones.html" class="btn btn-ghost" data-i18n="hero_cta_secondary"></a>
          </div>
        </div>
        <div class="hero-scroll">
          <span data-i18n="hero_scroll"></span>
          <span class="hero-scroll-line"></span>
        </div>
      </section>

      <!-- INTRO -->
      <section class="section intro" id="intro">
        <div class="wrap intro-grid">
          <div class="intro-text reveal">
            <p class="eyebrow" data-i18n="intro_eyebrow"></p>
            <h2 class="title">
              <span data-i18n="intro_title_1"></span>
              <em data-i18n="intro_title_2"></em>
              <span data-i18n="intro_title_3"></span>
            </h2>
            <p class="body" data-i18n="intro_p1"></p>
            <p class="body" data-i18n="intro_p2"></p>
            <p class="price-pill">
              <span class="price-label" data-i18n="intro_price_label"></span>
              <span class="price-value" data-i18n="intro_price_value"></span>
              <span class="price-label" data-i18n="intro_price_unit"></span>
            </p>
          </div>
          <figure class="intro-image reveal d2">
            <img src="https://images.pexels.com/photos/30041430/pexels-photo-30041430.jpeg?auto=compress&cs=tinysrgb&w=1000" alt="Olas de Chile Ecocamp" loading="lazy" />
          </figure>
        </div>
        <div class="wrap stats reveal">
          <div class="stat"><strong data-i18n="stat1_v"></strong><span data-i18n="stat1_l"></span></div>
          <div class="stat"><strong data-i18n="stat2_v"></strong><span data-i18n="stat2_l"></span></div>
          <div class="stat"><strong data-i18n="stat3_v"></strong><span data-i18n="stat3_l"></span></div>
          <div class="stat"><strong data-i18n="stat4_v"></strong><span data-i18n="stat4_l"></span></div>
        </div>
      </section>

      <!-- CATÉGORIES DE SITIOS -->
      <section class="section sites" id="sites">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="sites_eyebrow"></p>
            <h2 class="title"><span data-i18n="sites_title_1"></span> <em data-i18n="sites_title_2"></em></h2>
            <p class="lead" data-i18n="sites_lead"></p>
          </header>
          <div class="cat-grid" id="catGrid"></div>
          <p class="section-cta reveal">
            <a class="btn btn-dark" href="sitios.html" data-i18n="sites_cta"></a>
          </p>
        </div>
      </section>

      <!-- SERVICES (teaser) -->
      <section class="section svc-teaser">
        <div class="wrap svc-teaser-grid">
          <figure class="svc-teaser-img reveal">
            <img src="https://images.pexels.com/photos/6524840/pexels-photo-6524840.jpeg?auto=compress&cs=tinysrgb&w=1000" alt="" loading="lazy" />
          </figure>
          <div class="reveal d2">
            <p class="eyebrow" data-i18n="svc_teaser_eyebrow"></p>
            <h2 class="title"><span data-i18n="svc_teaser_title_1"></span> <em data-i18n="svc_teaser_title_2"></em></h2>
            <p class="body" data-i18n="svc_teaser_lead"></p>
            <p><a class="btn btn-dark" href="servicios.html" data-i18n="svc_teaser_cta"></a></p>
          </div>
        </div>
      </section>

      <!-- GALERIE -->
      <section class="section gallery" id="gallery">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="gallery_eyebrow"></p>
            <h2 class="title"><span data-i18n="gallery_title_1"></span> <em data-i18n="gallery_title_2"></em></h2>
          </header>
          <div class="gallery-grid reveal d2" id="galleryGrid"></div>
        </div>
      </section>

      <!-- TÉMOIGNAGES -->
      <section class="section testimonials">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="test_eyebrow"></p>
            <h2 class="title"><span data-i18n="test_title_1"></span> <em data-i18n="test_title_2"></em></h2>
          </header>
          <div class="testimonials-grid" id="testimonialsGrid"></div>
        </div>
      </section>

      <div id="contactMount"></div>
    </main>

    <div id="siteFooter"></div>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
      <img id="lightboxImg" src="" alt="" />
    </div>

    <script src="translations.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
