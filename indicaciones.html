<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cómo llegar a Olas de Chile Ecocamp y todo lo que necesitas saber antes de venir." />
    <meta name="theme-color" content="#2d4a3e" />
    <title>Cómo llegar — Olas de Chile Ecocamp</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/logo-web.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="directions" data-meta="dir_meta">
    <a class="skip-link" href="#main" data-i18n="skip">Ir al contenido</a>
    <div id="siteHeader"></div>

    <main id="main">
      <div id="pageHero"></div>

      <!-- ITINÉRAIRES + CARTE -->
      <section class="section">
        <div class="wrap directions-grid">
          <div class="reveal">
            <article class="route">
              <h3><span class="route-num">01</span><span data-i18n="dir_route1_title"></span></h3>
              <p data-i18n="dir_route1_text"></p>
            </article>
            <article class="route">
              <h3><span class="route-num">02</span><span data-i18n="dir_route2_title"></span></h3>
              <p data-i18n="dir_route2_text"></p>
            </article>
            <p class="note" data-i18n="dir_note"></p>
          </div>
          <div class="map reveal d2">
            <iframe
              title="Mapa Olas de Chile Ecocamp"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.openstreetmap.org/export/embed.html?bbox=-72.070%2C-34.432%2C-72.010%2C-34.396&layer=mapnik&marker=-34.4135%2C-72.0385"></iframe>
          </div>
        </div>
      </section>

      <!-- À PROXIMITÉ -->
      <section class="section alt">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="dir_near_eyebrow"></p>
            <h2 class="title"><span data-i18n="dir_near_title_1"></span> <em data-i18n="dir_near_title_2"></em></h2>
          </header>
          <div class="svc-grid" id="nearGrid"></div>
        </div>
      </section>

      <!-- RÈGLES -->
      <section class="section">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="rules_eyebrow"></p>
            <h2 class="title"><span data-i18n="rules_title_1"></span> <em data-i18n="rules_title_2"></em></h2>
            <p class="lead" data-i18n="rules_lead"></p>
          </header>
          <div class="rules-grid" id="rulesGrid"></div>
        </div>
      </section>

      <!-- CHECKLIST BAGAGES -->
      <section class="section alt">
        <div class="wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="pack_eyebrow"></p>
            <h2 class="title"><span data-i18n="pack_title_1"></span> <em data-i18n="pack_title_2"></em></h2>
            <p class="lead" data-i18n="pack_lead"></p>
          </header>
          <div class="pack-grid" id="packGrid"></div>
        </div>
      </section>

      <!-- FAQ -->
      <section class="section" id="faq">
        <div class="wrap faq-wrap">
          <header class="section-head center reveal">
            <p class="eyebrow" data-i18n="faq_eyebrow"></p>
            <h2 class="title"><span data-i18n="faq_title_1"></span> <em data-i18n="faq_title_2"></em></h2>
            <p class="lead" data-i18n="faq_lead"></p>
          </header>
          <div class="faq-list reveal" id="faqList"></div>
        </div>
      </section>

      <div id="contactMount"></div>
    </main>

    <div id="siteFooter"></div>

    <script src="translations.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
